apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bobpick-app
  namespace: bobpick
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-2:370201257485:certificate/11d02de7-dc95-452d-af9c-6ef1c1d0a258
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: bobpick.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bobpick-app
                port:
                  number: 80
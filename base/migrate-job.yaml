apiVersion: batch/v1
kind: Job
metadata:
  name: bobpick-migrate
  namespace: bobpick
  annotations:
    description: "배포 전 1회 실행 — DB 마이그레이션(migrate) + 정적 파일 S3 업로드(collectstatic)"
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: bobpick-app-sa
      restartPolicy: Never
      containers:
        - name: migrate
          image: bobpick-app-image:placeholder
          command:
            - sh
            - -c
            - "python manage.py migrate && python manage.py collectstatic --noinput"
          envFrom:
            - configMapRef:
                name: bobpick-app-config
            - secretRef:
                name: bobpick-app-secret
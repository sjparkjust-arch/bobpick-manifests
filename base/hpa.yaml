apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bobpick-app
  namespace: bobpick
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bobpick-app
  minReplicas: 4
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
